spring.application.name=api_epi

# Configuração da conexão com o banco de dados MySQL.
# Os valores padrão mantêm o funcionamento local; em outro ambiente,
# defina as variáveis DB_URL, DB_USER e DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/epi_db}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Configurações do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Porta do servidor
server.port=8080
