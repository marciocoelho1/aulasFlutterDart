# Configuração usada apenas pelos testes (src/test/resources tem prioridade).
# H2 em memória no modo MySQL: `mvnw test` não depende do MySQL local.
spring.datasource.url=jdbc:h2:mem:epi_db;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
